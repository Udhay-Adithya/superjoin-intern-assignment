[project]
name = "fact-knowledge-layer"
version = "0.1.0"
description = "Extracts grounded facts from PDFs and reconciles them across documents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pymupdf>=1.24",
    "openai>=1.55",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "numpy>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
